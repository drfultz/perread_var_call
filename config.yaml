FEATURES:
    - A # DRF_full3ETS_VARs3
    - B # CS1092 GB IGSes
    - C # DRF_5ETS_VARs
    - D # 18S_1stdel
    - E # 18S_2nddel
    - F # AtGP2 from NOR2
    - G # SalI-5'ETS deletion
    - H # 18S-SalI deletion
    - I # telomere repeats
    - J # 190bp 25S del
    - K

Splitting_Seq: refs/25S_rDNA_Col-0_consensus.fa
MIN_ALIGN_LENGTH: 1000  #Splitting sequence alignment length to cause split
REORIENT: Y  #Y to reorient original reads, anything else does not

VARIANT_LEN_COV_MIN: .8 #decimal fraction for minimal coverage length against the top variant hit to produce any call
VARIANT_LEN_COV_BEST: .95 #decimal fraction for minimal coverage length against the top variant hit to produce a call that is not flagged with %
